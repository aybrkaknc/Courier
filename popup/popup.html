<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title data-i18n="extName"></title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <h1 data-i18n="extName"></h1>
    <div id="alert" role="alert" hidden>
      <strong data-i18n="popupAlertTitle"></strong>
      <p id="alert-text"></p>
    </div>
    <div id="actions" hidden>
      <button type="button" data-action="send-page" data-i18n="popupSendPage"></button>
      <button type="button" data-action="send-screenshot" data-i18n="popupScreenshot"></button>
      <button type="button" data-action="send-area" data-i18n="popupArea"></button>
    </div>
    <p id="not-configured" data-i18n="popupNotConfigured" hidden></p>
    <p id="status" role="status"></p>
    <button type="button" id="settings" class="secondary" data-i18n="openSettings"></button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
