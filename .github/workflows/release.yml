# Push a tag named v<version> (for example v1.0.0, or v1.0.0-beta for a
# pre-release). The workflow builds the Chrome and Firefox packages and attaches
# them to a DRAFT release. Check the draft on the Releases page, then press Publish.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: npm run build

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "${{ github.ref_name }}" in *-*) flags="--prerelease";; esac
          gh release create "${{ github.ref_name }}" dist/chrome.zip dist/firefox.zip \
            --draft $flags --generate-notes \
            --title "${{ github.event.repository.name }} ${{ github.ref_name }}"
